<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- Background for the CrashPulse disk image window (640 x 400 pt content area).
       Finder draws the app icon centered at (170, 190) and Applications at (470, 190),
       both at 128 pt. Between them, the icon's CPU trace becomes the drag arrow. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFDFE"/>
      <stop offset="1" stop-color="#ECEFF4"/>
    </linearGradient>
    <linearGradient id="trace" x1="252" y1="0" x2="392" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A3ABB8"/>
      <stop offset="0.30" stop-color="#A3ABB8"/>
      <stop offset="0.40" stop-color="#FF8A00"/>
      <stop offset="0.55" stop-color="#FF3B30"/>
      <stop offset="0.70" stop-color="#FF3B30"/>
      <stop offset="0.80" stop-color="#A3ABB8"/>
      <stop offset="1" stop-color="#A3ABB8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#face)"/>

  <!-- Chart levels, as in the app icon -->
  <g stroke="#23324D" stroke-width="1" stroke-linecap="round">
    <line x1="48" y1="76" x2="592" y2="76" stroke-opacity="0.05"/>
    <line x1="48" y1="304" x2="592" y2="304" stroke-opacity="0.08"/>
  </g>

  <!-- Event span and CPU trace -->
  <rect x="301" y="150" width="54" height="52" rx="7" fill="#FF3B30" fill-opacity="0.07"/>
  <g fill="none" stroke="url(#trace)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 252 190 L 288 190
             C 298 190 298 162 308 162
             C 315 162 317 168 323 168
             C 329 168 331 160 338 160
             C 346 160 348 190 358 190
             L 389 190"/>
    <path d="M 381 182 L 389 190 L 381 198"/>
  </g>

  <!-- Instructions -->
  <g font-family="System Font, Helvetica Neue, sans-serif" text-anchor="middle">
    <text x="320" y="340" font-size="13" font-weight="600" fill="#3A4150">Drag CrashPulse to Applications</text>
    <text x="320" y="360" font-size="11" fill="#7A8290">Once opened, it lives in the menu bar.</text>
  </g>
</svg>
